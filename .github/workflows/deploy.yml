name: Deploy to Lightsail

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Upload files to Lightsail
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: "."
          target: "~/app"

      - name: SSH into Lightsail and deploy
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            # Install Node.js if not already installed
            curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
            sudo apt-get install -y nodejs nginx
            
            # Set up folders
            mkdir -p ~/app/Client ~/app/Server

            # Write Client .env
            echo "VITE_API_URL=https://purabpatel.com/api/" > ~/app/Client/.env           
            
            # Write Server .env
            echo "PORT=${{ secrets.PORT }}" > ~/app/Server/.env
            echo "GHUB_TOKEN=${{ secrets.GHUB_TOKEN }}" > ~/app/Server/.env
            echo "SMTP_HOST=${{ secrets.SMTP_HOST }}" > ~/app/Server/.env
            echo "SMTP_PORT=${{ secrets.SMTP_PORT }}" > ~/app/Server/.env
            echo "SMTP_USER=${{ secrets.SMTP_USER }}" > ~/app/Server/.env
            echo "SMTP_PASS=${{ secrets.SMTP_PASS }}" > ~/app/Server/.env
            echo "EMAIL_FROM=${{ secrets.EMAIL_FROM }}" > ~/app/Server/.env
            echo "EMAIL_TO=${{ secrets.EMAIL_TO }}" > ~/app/Server/.env
            
            # Install dependencies
            cd ~/app/Client
            rm -rf node_modules package-lock.json
            npm install
            npm run build

            cd ~/app/Server
            npm install

            # Restart Express backend (using pm2 for process management)
            if ! command -v pm2 &> /dev/null; then
              sudo npm install -g pm2
            fi
            pm2 start server.js --name backend --cwd ~/app/Server --update-env || pm2 restart backend

            # Deploy frontend build to NGINX
            sudo rm -rf /var/www/html/*
            sudo cp -r ~/app/Client/dist/* /var/www/html/

      - name: Deploy Nginx configuration
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            sudo bash -c 'cat > /etc/nginx/sites-available/purabpatel.com' << 'EOF'
            server {
                listen 80;
                server_name purabpatel.com www.purabpatel.com;
                return 301 https://$host$request_uri; # Redirect HTTP to HTTPS
            }

            server {
                listen 443 ssl;
                server_name purabpatel.com www.purabpatel.com;

                ssl_certificate /etc/letsencrypt/live/purabpatel.com/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/purabpatel.com/privkey.pem;

                location /api/ {
                    proxy_pass http://localhost:5000;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                }

                location / {
                    root /var/www/html;
                    try_files $uri /index.html;
                }
            }
            EOF

            # Enable the configuration
            sudo ln -sf /etc/nginx/sites-available/purabpatel.com /etc/nginx/sites-enabled/

            # Remove default Nginx configuration
            sudo rm -f /etc/nginx/sites-enabled/default

            # Test Nginx configuration
            sudo nginx -t

            # Restart Nginx
            sudo systemctl restart nginx