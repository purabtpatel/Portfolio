name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend on CI runner
        run: |
          echo "VITE_API_URL=https://purabpatel.com/api/" > Client/.env
          cd Client
          npm install
          npm run build

      - name: Upload Server source to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: "Server"
          target: "~/app"

      - name: Upload frontend dist to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: "Client/dist"
          target: "~/app"

      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            # Install Node.js and nginx if not already installed
            curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
            sudo apt-get install -y nodejs nginx

            # Write Server .env directly (no sudo — user owns their home dir)
            cat > ~/app/Server/.env << 'ENVEOF'
            PORT=${{ secrets.PORT }}
            GHUB_TOKEN=${{ secrets.GHUB_TOKEN }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            EMAIL_FROM=${{ secrets.EMAIL_FROM }}
            EMAIL_TO=${{ secrets.EMAIL_TO }}
            ENVEOF

            # Install server dependencies
            cd ~/app/Server
            npm install

            # Install pm2 if needed, then start or restart backend
            if ! command -v pm2 &> /dev/null; then
              sudo npm install -g pm2
            fi
            pm2 start server.js --name backend --cwd ~/app/Server --update-env || pm2 restart backend --update-env

            # Deploy built frontend to nginx
            sudo rm -rf /var/www/html/*
            sudo cp -r ~/app/Client/dist/* /var/www/html/

      - name: Deploy Nginx configuration
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            sudo bash -c 'cat > /etc/nginx/sites-available/purabpatel.com' << 'EOF'
            server {
                listen 80;
                server_name purabpatel.com www.purabpatel.com;
                return 301 https://$host$request_uri;
            }

            server {
                listen 443 ssl;
                server_name purabpatel.com www.purabpatel.com;

                ssl_certificate /etc/letsencrypt/live/purabpatel.com/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/purabpatel.com/privkey.pem;

                location /api/ {
                    proxy_pass http://localhost:5000;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                }

                location / {
                    root /var/www/html;
                    try_files $uri /index.html;
                }
            }
            EOF

            sudo ln -sf /etc/nginx/sites-available/purabpatel.com /etc/nginx/sites-enabled/
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t
            sudo systemctl restart nginx
