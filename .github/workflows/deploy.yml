name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Upload files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "~/app"
          strip_components: 1

      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Install Node.js if not already installed
            if ! command -v node &> /dev/null; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

            # Install nginx if not already installed
            if ! command -v nginx &> /dev/null; then
              sudo apt-get install -y nginx
            fi

            # Set up folders
            mkdir -p ~/app/Client ~/app/Server

            # Write Client .env
            echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" > ~/app/Client/.env

            # Write Server .env
            cat > ~/app/Server/.env << EOF
            PORT=${{ secrets.PORT }}
            GHUB_TOKEN=${{ secrets.GHUB_TOKEN }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            EMAIL_FROM=${{ secrets.EMAIL_FROM }}
            EMAIL_TO=${{ secrets.EMAIL_TO }}
            EOF

            # Install dependencies and build frontend
            cd ~/app/Client
            npm install
            npm run build

            # Install backend dependencies
            cd ~/app/Server
            npm install

            # Install pm2 globally if not installed
            if ! command -v pm2 &> /dev/null; then
              sudo npm install -g pm2
            fi

            # Restart Express backend
            pm2 start server.js --name backend --cwd ~/app/Server --update-env || pm2 restart backend

            # Deploy frontend build to NGINX
            sudo rm -rf /var/www/html/*
            sudo cp -r ~/app/Client/dist/* /var/www/html/

            # Configure NGINX
            sudo bash -c 'cat > /etc/nginx/sites-available/default << EOF
            server {
                listen 80 default_server;
                listen [::]:80 default_server;

                root /var/www/html;
                index index.html;

                server_name _;

                location / {
                    try_files \$uri \$uri/ /index.html;
                }

                location /api/ {
                    proxy_pass http://localhost:${{ secrets.PORT }};
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade \$http_upgrade;
                    proxy_set_header Connection "upgrade";
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                }
            }
            EOF'

            # Test NGINX configuration
            sudo nginx -t

            # Start and enable NGINX
            sudo systemctl enable nginx
            sudo systemctl restart nginx